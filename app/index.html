<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Test Fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #081321; color: #f4f7fb; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(calc(100% - 32px), 420px); padding: 32px; background: #102035; border: 1px solid #29435f; border-radius: 16px; }
    h1 { margin: 0 0 8px; }
    p { color: #a9bacd; }
    label { display: grid; gap: 6px; margin-top: 16px; font-weight: 700; }
    input, button { min-height: 46px; border-radius: 8px; font: inherit; }
    input { padding: 10px 12px; color: #f4f7fb; background: #081321; border: 1px solid #38536f; }
    button { width: 100%; margin-top: 22px; border: 0; background: #66a6ff; color: #04101e; font-weight: 800; cursor: pointer; }
    #message { min-height: 24px; margin-bottom: 0; color: #69ddb0; }
  </style>
</head>
<body>
  <main>
    <h1>QA Demo Login</h1>
    <p>Deterministic test fixture for browser automation.</p>
    <form id="login-form">
      <label>Email<input id="email" name="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <button id="login-button" type="submit">Sign in</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      document.getElementById('message').textContent =
        email === 'demo@example.com' && password === 'Quality123'
          ? 'Welcome, QA Engineer.'
          : 'Invalid email or password.';
    });
  </script>
</body>
</html>
